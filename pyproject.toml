[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lyricmv"
version = "0.1.0"
description = "Turn a song and a few images into a lyric music video: Whisper-aligned subtitles, Ken Burns motion and scene changes, rendered by FFmpeg in one pass."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "src/lyricmv/fonts/licenses/*"]
requires-python = ">=3.10"
keywords = ["music video", "lyrics", "subtitles", "whisper", "ffmpeg", "karaoke", "suno"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "numpy>=1.24",
    "opencc-python-reimplemented>=0.1.7",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
# Apple Silicon: much faster transcription on the GPU
mlx = ["mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
test = ["pytest>=8"]

[project.scripts]
lyricmv = "lyricmv.cli:main"

[project.urls]
Homepage = "https://github.com/softwarejob/lyricmv"
Issues = "https://github.com/softwarejob/lyricmv/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lyricmv"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "README.zh-TW.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
